name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Needed to create/delete releases with the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Platform 35 & Build Tools
        run: |
          # ubuntu-latest runners already ship the Android SDK; setup-android@v3
          # is not used because it runs `sdkmanager tools`, a package that no
          # longer exists in current cmdline-tools, which fails the build.
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"


      - name: Download Sherpa-ONNX 1.12.31 Android AAR
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.12.31.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.31/sherpa-onnx-1.12.31.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiDict-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Rename APK to GeminiDict.apk
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GeminiDict.apk
          ls -l app/build/outputs/apk/debug/GeminiDict.apk

      # Push builds only (not pull requests): publish the APK as a GitHub
      # Release and delete every older release, so only the latest one stays.
      - name: Read version
        id: version
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release (keep only latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v${{ steps.version.outputs.version }}-${{ github.run_number }}"
          APK=app/build/outputs/apk/debug/GeminiDict.apk
          gh release create "$TAG" "$APK" \
            --title "GeminiDictAndroid v${{ steps.version.outputs.version }} (build ${{ github.run_number }})" \
            --notes "自动构建：单元测试通过后的 Debug APK（GeminiDict.apk）。安装后在设置页填写 Gemini API Key 即可使用 AI 翻译；不填 Key 也可完整离线使用。"
          # Delete every older release (with its tag) so only the latest remains.
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -v "^${TAG}$" || true); do
            gh release delete "$t" -y --cleanup-tag
          done
